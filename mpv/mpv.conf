save-position-on-quit=no

# ====================================================================
# 1. FiiO K7 ALSA 직통 지정 (탐색 시 오디오 딜레이/슬로우 모션 근본 해결)
# ====================================================================
ao=alsa
audio-device=alsa/front:CARD=K7,DEV=0

# ====================================================================
# 2. A/V 싱크 정상화 (이제 오디오 클럭이 즉시 잡히므로 정상 동작)
# ====================================================================
video-sync=audio
autosync=30

# ====================================================================
# 3. 키프레임 탐색 및 드롭 설정
# ====================================================================
hr-seek=no
framedrop=vo

# ====================================================================
# 4. HW 가속 및 CPU 디코딩
# ====================================================================
hwdec=auto-safe
vd-lavc-threads=4

# 데먹서 버퍼
demuxer-max-bytes=100M
demuxer-readahead-secs=5
